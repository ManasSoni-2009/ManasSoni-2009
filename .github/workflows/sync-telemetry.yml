name: Sync Architectural Telemetry SVG

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'README.md'

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install minimal SVG compiler dependencies
        run: npm install --no-save opentype.js
      - name: Refresh Live Architectural Telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-telemetry.mjs
      - name: Commit updated telemetry SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/04_telemetry_live.svg
          git diff --staged --quiet || (git commit -m "chore: sync architectural telemetry svg" && git push)
